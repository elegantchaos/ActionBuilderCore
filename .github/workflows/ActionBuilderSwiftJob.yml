name: ActionBuilder Swift Job

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      swift-version:
        required: true
        type: string
      compiler-id:
        required: true
        type: string
      setup-mode:
        required: true
        type: string
      xcode-version:
        required: false
        type: string
        default: ""
      toolchain-branch:
        required: false
        type: string
        default: ""
      operation:
        required: true
        type: string
      separate-test-methods:
        required: false
        type: boolean
        default: true
      notification-job-name:
        required: false
        type: string
        default: ""
    secrets:
      SLACK_WEBHOOK:
        required: false

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    steps:
        - name: Checkout
          uses: actions/checkout@v6
        - name: Prepare Job
          env:
            INSTALL_XCBEAUTIFY: ${{ inputs.platform == 'macOS' }}
          run: |
            LOGS_DIR="${GITHUB_WORKSPACE:-$PWD}/logs"
            mkdir -p "$LOGS_DIR"
            if [[ "$PWD/logs" != "$LOGS_DIR" && ! -e logs ]]
            then
              ln -s "$LOGS_DIR" logs
            fi
            {
              echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "runner=${RUNNER_NAME:-unknown} (${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown})"
              echo "workflow=${GITHUB_WORKFLOW:-unknown}"
              echo "job=${GITHUB_JOB:-unknown}"
              echo "run_id=${GITHUB_RUN_ID:-unknown}"
              echo "ref=${GITHUB_REF:-unknown}"
              echo "sha=${GITHUB_SHA:-unknown}"
            } > "$LOGS_DIR/run.log"

            if [[ "$INSTALL_XCBEAUTIFY" != "true" ]]
            then
              echo "xcbeautify is not required for this job."
            elif command -v xcbeautify >/dev/null 2>&1
            then
              echo "xcbeautify already installed."
            elif brew install xcbeautify > logs/install-xcbeautify.log 2>&1
            then
              echo "xcbeautify installed."
            else
              echo "::error::Failed to install xcbeautify."
              cat logs/install-xcbeautify.log
              exit 1
            fi
        - name: Select Swift
          if: ${{ inputs.setup-mode == 'release' }}
          uses: elegantchaos/setup-swift@allow-patch
          with:
            swift-version: ${{ inputs.swift-version }}
            skip-verify-signature: ${{ inputs.platform == 'linux' }}
            allow-patch: true
        - name: Swift Version
          run: swift --version
        - name: Build (release)
          env:
            PLATFORM: ${{ inputs.platform }}
          run: |
            LOG="logs/swift-build-release.log"
            if swift build --configuration release --quiet >"$LOG" 2>&1
            then
              echo "Build (release) succeeded."
            else
              echo "::error::Build (release) failed."
              if [[ "$PLATFORM" == "macOS" ]]
              then
                cat "$LOG" | xcbeautify --quiet --disable-logging --renderer github-actions || cat "$LOG"
              else
                cat "$LOG"
              fi
              exit 1
            fi
        - name: Test (release Swift Testing)
          if: ${{ inputs.operation == 'test' }}
          env:
            PLATFORM: ${{ inputs.platform }}
          run: |
            LOG="logs/swift-test-swift-testing-release.log"
            if swift test --disable-xctest --configuration release >"$LOG" 2>&1
            then
              echo "Test (release Swift Testing) succeeded."
            else
              echo "::error::Test (release Swift Testing) failed."
              if [[ "$PLATFORM" == "macOS" ]]
              then
                cat "$LOG" | xcbeautify --quiet --disable-logging --renderer github-actions || cat "$LOG"
              else
                cat "$LOG"
              fi
              exit 1
            fi
        - name: Upload Logs
          if: ${{ always() }}
          uses: actions/upload-artifact@v7
          with:
            name: ${{ inputs.platform }}-${{ inputs.compiler-id }}-logs
            path: logs
