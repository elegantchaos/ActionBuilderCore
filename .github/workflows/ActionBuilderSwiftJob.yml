name: ActionBuilder Swift Job

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      swift-version:
        required: true
        type: string
      compiler-id:
        required: true
        type: string
      setup-mode:
        required: true
        type: string
      xcode-version:
        required: false
        type: string
        default: ""
      toolchain-branch:
        required: false
        type: string
        default: ""
      operation:
        required: true
        type: string
      separate-test-methods:
        required: false
        type: boolean
        default: true
      upload-logs:
        required: false
        type: boolean
        default: true
      post-slack:
        required: false
        type: boolean
        default: false
      notification-job-name:
        required: false
        type: string
        default: ""
    secrets:
      SLACK_WEBHOOK:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
        - name: Checkout
          uses: actions/checkout@v6
        - name: Make Logs Directory
          run: |
            LOGS_DIR="${GITHUB_WORKSPACE:-$PWD}/logs"
            mkdir -p "$LOGS_DIR"
            if [[ "$PWD/logs" != "$LOGS_DIR" && ! -e logs ]]
            then
              ln -s "$LOGS_DIR" logs
            fi
            {
              echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "runner=${RUNNER_NAME:-unknown} (${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown})"
              echo "workflow=${GITHUB_WORKFLOW:-unknown}"
              echo "job=${GITHUB_JOB:-unknown}"
              echo "run_id=${GITHUB_RUN_ID:-unknown}"
              echo "ref=${GITHUB_REF:-unknown}"
              echo "sha=${GITHUB_SHA:-unknown}"
            } > "$LOGS_DIR/run.log"
        - name: Install xcbeautify
          if: ${{ inputs.platform == 'macOS' }}
          run: |
            if command -v xcbeautify >/dev/null 2>&1
            then
              echo "xcbeautify already installed."
            elif brew install xcbeautify > logs/install-xcbeautify.log 2>&1
            then
              echo "xcbeautify installed."
            else
              echo "::error::Failed to install xcbeautify."
              cat logs/install-xcbeautify.log
              exit 1
            fi
        - name: Select Swift on Linux
          if: ${{ inputs.setup-mode == 'release' && inputs.platform == 'linux' }}
          uses: elegantchaos/setup-swift@allow-patch
          with:
            swift-version: ${{ inputs.swift-version }}
            skip-verify-signature: true
            allow-patch: true
        - name: Select Swift
          if: ${{ inputs.setup-mode == 'release' && inputs.platform != 'linux' }}
          uses: elegantchaos/setup-swift@allow-patch
          with:
            swift-version: ${{ inputs.swift-version }}
            allow-patch: true
        - name: Select Swift Development Snapshot
          if: ${{ inputs.setup-mode == 'development' }}
          uses: SwiftyLab/setup-swift@v1
          with:
            development: true
        - name: Select Swift Snapshot
          if: ${{ inputs.setup-mode == 'snapshot' }}
          uses: SwiftyLab/setup-swift@v1
          with:
            development: true
            swift-version: ${{ inputs.swift-version }}
        - name: Select Snapshot Xcode Version
          if: ${{ inputs.setup-mode == 'xcode-toolchain' }}
          uses: maxim-lobanov/setup-xcode@v1
          with:
            xcode-version: ${{ inputs.xcode-version }}
        - name: Install Swift Snapshot Toolchain
          if: ${{ inputs.setup-mode == 'xcode-toolchain' }}
          env:
            TOOLCHAIN_BRANCH: ${{ inputs.toolchain-branch }}
          run: |
            wget --quiet "https://download.swift.org/$TOOLCHAIN_BRANCH/xcode/latest-build.yml"
            grep "download:" < latest-build.yml > filtered.yml
            sed -e 's/-osx.pkg//g' filtered.yml > stripped.yml
            sed -e 's/:[^:\/\/]/YML="/g;s/$/"/g;s/ *=/=/g' stripped.yml > snapshot.sh
            source snapshot.sh
            echo "Installing toolchain: $downloadYML"
            wget --quiet "https://swift.org/builds/$TOOLCHAIN_BRANCH/xcode/$downloadYML/$downloadYML-osx.pkg"
            sudo installer -pkg "$downloadYML-osx.pkg" -target /
            ln -s "/Library/Developer/Toolchains/$downloadYML.xctoolchain/usr/bin" swift-latest
            echo "$PWD/swift-latest" >> "$GITHUB_PATH"
            echo "TOOLCHAINS=swift" >> "$GITHUB_ENV"
            ls -d /Applications/Xcode* > logs/xcode-versions.log
            swift --version
        - name: Snapshot Xcode Version
          if: ${{ inputs.setup-mode == 'xcode-toolchain' }}
          run: |
            xcodebuild -version
            xcrun swift --version
        - name: Swift Version
          run: swift --version
        - name: Build (release)
          env:
            PLATFORM: ${{ inputs.platform }}
          run: |
            LOG="logs/swift-build-release.log"
            if swift build --configuration release --quiet >"$LOG" 2>&1
            then
              echo "Build (release) succeeded."
            else
              echo "::error::Build (release) failed."
              if [[ "$PLATFORM" == "macOS" ]]
              then
                cat "$LOG" | xcbeautify --quiet --disable-logging --renderer github-actions || cat "$LOG"
              else
                cat "$LOG"
              fi
              exit 1
            fi
        - name: Test (release XCTest)
          if: ${{ inputs.operation == 'test' && inputs.separate-test-methods }}
          env:
            PLATFORM: ${{ inputs.platform }}
          run: |
            LOG="logs/swift-test-xctest-release.log"
            if swift test --disable-swift-testing --configuration release >"$LOG" 2>&1
            then
              echo "Test (release XCTest) succeeded."
            else
              echo "::error::Test (release XCTest) failed."
              if [[ "$PLATFORM" == "macOS" ]]
              then
                cat "$LOG" | xcbeautify --quiet --disable-logging --renderer github-actions || cat "$LOG"
              else
                cat "$LOG"
              fi
              exit 1
            fi
        - name: Test (release Swift Testing)
          if: ${{ inputs.operation == 'test' && inputs.separate-test-methods }}
          env:
            PLATFORM: ${{ inputs.platform }}
          run: |
            LOG="logs/swift-test-swift-testing-release.log"
            if swift test --disable-xctest --configuration release >"$LOG" 2>&1
            then
              echo "Test (release Swift Testing) succeeded."
            else
              echo "::error::Test (release Swift Testing) failed."
              if [[ "$PLATFORM" == "macOS" ]]
              then
                cat "$LOG" | xcbeautify --quiet --disable-logging --renderer github-actions || cat "$LOG"
              else
                cat "$LOG"
              fi
              exit 1
            fi
        - name: Test (release)
          if: ${{ inputs.operation == 'test' && !inputs.separate-test-methods }}
          env:
            PLATFORM: ${{ inputs.platform }}
          run: |
            LOG="logs/swift-test-release.log"
            if swift test --configuration release >"$LOG" 2>&1
            then
              echo "Test (release) succeeded."
            else
              echo "::error::Test (release) failed."
              if [[ "$PLATFORM" == "macOS" ]]
              then
                cat "$LOG" | xcbeautify --quiet --disable-logging --renderer github-actions || cat "$LOG"
              else
                cat "$LOG"
              fi
              exit 1
            fi
        - name: Upload Logs
          if: ${{ always() && inputs.upload-logs }}
          uses: actions/upload-artifact@v7
          with:
            name: ${{ inputs.platform }}-${{ inputs.compiler-id }}-logs
            path: logs
        - name: Slack Notification
          if: ${{ always() && inputs.post-slack }}
          uses: elegantchaos/slatify@master
          with:
            type: ${{ job.status }}
            job_name: ${{ inputs.notification-job-name }}
            mention_if: failure
            url: ${{ secrets.SLACK_WEBHOOK }}
